[build]
  command = "npm run build"
  publish = "dist"

# Environment variables hint (set these in Netlify Dashboard)
# VITE_SUPABASE_URL = your_supabase_project_url
# VITE_SUPABASE_ANON_KEY = your_supabase_anon_key

# Redirects are defined in public/_redirects (copied to dist/_redirects during build).
# Netlify processes _redirects first, so all routes are handled there.

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.open-meteo.com; font-src 'self' https:; frame-ancestors 'none';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
