[build]
  command = "npm run build"
  publish = "dist"

# Environment variables hint (set these in Netlify Dashboard)
# VITE_SUPABASE_URL = your_supabase_project_url
# VITE_SUPABASE_ANON_KEY = your_supabase_anon_key

# Clean URL redirects — specific routes must come before the catch-all
[[redirects]]
  from = "/dashboard"
  to = "/src/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/campaign/:id"
  to = "/src/pages/campaign-detail.html"
  status = 200

[[redirects]]
  from = "/create-campaign"
  to = "/src/pages/create-campaign.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/src/pages/profile.html"
  status = 200

[[redirects]]
  from = "/rewards"
  to = "/src/pages/rewards.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/src/pages/admin.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/src/pages/events.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/src/pages/privacy.html"
  status = 200

[[redirects]]
  from = "/stats"
  to = "/src/pages/stats.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/src/pages/forgot-password.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/src/pages/reset-password.html"
  status = 200

# Catch-all — serves login page for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://api.open-meteo.com; font-src 'self' https:; frame-ancestors 'none';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
