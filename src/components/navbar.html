<!-- Navigation Bar with Language Selector -->
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <strong>♻️ Clean Quarter</strong>
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/dashboard" data-i18n="nav.dashboard">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/create-campaign" data-i18n="nav.createCampaign"
            >New Campaign</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/rewards" data-i18n="nav.rewards">Rewards</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/profile" data-i18n="nav.profile">Profile</a>
        </li>
        <li class="nav-item" id="adminNav" style="display: none">
          <a class="nav-link" href="/admin" data-i18n="nav.admin">Admin</a>
        </li>
        <!-- Notification Bell -->
        <li class="nav-item" id="notificationNavItem" style="display: none">
          <div class="notification-bell" id="notificationBell">
            <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z"
                />
              </svg>
              <span class="notification-badge d-none" id="notificationBadge">0</span>
            </button>
            <div class="notification-dropdown" id="notificationDropdown" style="display: none">
              <div class="notification-header">
                <span data-i18n="notifications.title">Известия</span>
                <button
                  class="notification-mark-all"
                  id="markAllReadBtn"
                  data-i18n="notifications.markAllRead"
                >
                  Маркирай всички
                </button>
              </div>
              <div class="notification-list" id="notificationList">
                <p class="notification-empty" data-i18n="notifications.empty">Няма известия</p>
              </div>
            </div>
          </div>
        </li>

        <li class="nav-item">
          <select
            id="languageSelector"
            class="form-select form-select-sm"
            style="width: 140px; margin: 0.5rem 0.5rem"
          >
            <option value="bg">🇧🇬 Български</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </li>
        <li class="nav-item">
          <button class="btn btn-danger btn-sm" id="logoutBtn" data-i18n="nav.logout">
            Logout
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  /**
   * Navbar initialization script
   * Loads navbar and sets up language switching
   */
  async function initNavbar() {
    // Check if user is logged in
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
      window.location.href = "/";
      return;
    }

    // Show admin nav if user is admin
    if (user.role === "admin") {
      const adminNav = document.getElementById("adminNav");
      if (adminNav) {
        adminNav.style.display = "block";
      }
    }

    // Setup logout button
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", async () => {
        localStorage.removeItem("user");
        window.location.href = "/";
      });
    }

    // Setup notification bell (skip for demo users — no real DB access)
    const { isDemoUser } = await import("../../utils/demoMode.js");
    if (user.id && !isDemoUser(user)) {
      await initNotifications(user.id);
    }

    // Setup language selector
    const langSelector = document.getElementById("languageSelector");
    if (langSelector) {
      // Load from utils/i18n.js
      const { setLanguage, getCurrentLanguage, initI18n } = await import("../../utils/i18n.js");

      // Initialize i18n first
      await initI18n();

      // Set current language in selector
      langSelector.value = getCurrentLanguage();

      // Listen for language changes
      langSelector.addEventListener("change", (e) => {
        setLanguage(e.target.value);
      });
    }
  }

  // ─── Notification bell ──────────────────────────────────────────────────────

  async function initNotifications(userId) {
    const { initNotificationBell } = await import("../../services/notifications.js");
    await initNotificationBell(userId);
  }

  // Initialize when DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initNavbar);
  } else {
    initNavbar();
  }
</script>
