<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Clean Quarter</title>

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Global Styles -->
    <link rel="stylesheet" href="../assets/style.css" />

    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="../assets/dashboard.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"> ♻️ Чист Квартал </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/create-campaign" data-i18n="nav.createCampaign"
                >Нова кампания</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/rewards" data-i18n="nav.rewards">Награди</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile" data-i18n="nav.profile">Профил</a>
            </li>
            <li class="nav-item">
              <select
                id="languageSelector"
                class="form-select form-select-sm"
                style="max-width: 150px; margin-right: 0.5rem; display: none"
              >
                <option value="bg">🇧🇬 Български</option>
                <option value="en">🇬🇧 English</option>
              </select>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link" id="logoutBtn" data-i18n="nav.logout">Излизане</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Map Container -->
      <div id="map"></div>

      <!-- Cleanups Near You Section -->
      <div class="campaigns-section">
        <div class="container-fluid">
          <div class="campaigns-header">
            <h2 class="mb-4" data-i18n="dashboard.nearYou">Почистване в близост до вас</h2>
          </div>

          <!-- Loading Spinner -->
          <div id="loadingSpinner" class="spinner-container">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden" data-i18n="common.loading">Зареждане...</span>
            </div>
          </div>

          <!-- Campaigns Cards Container -->
          <div id="campaignsContainer" class="campaigns-grid"></div>

          <!-- No Campaigns Message -->
          <div id="noCampaignsMessage" class="no-campaigns-message" style="display: none">
            <p data-i18n="dashboard.noCampaigns">Няма активни кампании</p>
          </div>

          <!-- Load More -->
          <div id="loadMoreContainer" style="text-align: center; padding: 1.5rem 0; display: none">
            <button id="loadMoreBtn" class="btn btn-outline-success btn-lg">
              ⬇️ <span data-i18n="dashboard.loadMore">Зареди още</span>
            </button>
            <p id="campaignsCounter" class="text-muted mt-2" style="font-size: 0.9rem"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard Script -->
    <script type="module" src="../scripts/dashboard.js"></script>
  </body>
</html>
