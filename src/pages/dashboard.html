<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Clean Quarter</title>

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Global Styles -->
    <link rel="stylesheet" href="../assets/style.css" />

    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="../assets/dashboard.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">♻️ Чист Квартал</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/create-campaign" data-i18n="nav.createCampaign"
                >Нова кампания</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/rewards" data-i18n="nav.rewards">Награди</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile" data-i18n="nav.profile">Профил</a>
            </li>
            <li class="nav-item" id="adminNavItem" style="display: none">
              <a class="nav-link" href="/admin" data-i18n="nav.admin">Админ</a>
            </li>
            <!-- Notification Bell -->
            <li class="nav-item" id="notificationNavItem" style="display: none">
              <div class="notification-bell" id="notificationBell">
                <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm.995-14.901a1 1 0 1 0-1.99 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901z"
                    />
                  </svg>
                  <span class="notification-badge d-none" id="notificationBadge">0</span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown" style="display: none">
                  <div class="notification-header">
                    <span data-i18n="notifications.title">Известия</span>
                    <button
                      class="notification-mark-all"
                      id="markAllReadBtn"
                      data-i18n="notifications.markAllRead"
                    >
                      Маркирай всички
                    </button>
                  </div>
                  <div class="notification-list" id="notificationList">
                    <p class="notification-empty" data-i18n="notifications.empty">Няма известия</p>
                  </div>
                </div>
              </div>
            </li>
            <li class="nav-item">
              <select
                id="languageSelector"
                class="form-select form-select-sm"
                style="max-width: 150px; margin: 0.5rem 0.5rem; display: none"
              >
                <option value="bg">🇧🇬 Български</option>
                <option value="en">🇬🇧 English</option>
              </select>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link" id="logoutBtn" data-i18n="nav.logout">Излизане</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Admin Banner (visible only for admins) -->
    <div id="adminBanner" class="alert alert-warning mb-0 rounded-0" style="display: none">
      <div class="container-fluid d-flex align-items-center gap-3">
        <span data-i18n="dashboard.adminBannerLabel">Администратор:</span>
        <strong
          ><span id="pendingCount">0</span>
          <span data-i18n="dashboard.adminBannerPending">чакащи одобрения</span></strong
        >
        <a href="/admin" class="btn btn-sm btn-warning ms-2" data-i18n="dashboard.adminBannerBtn"
          >Към Admin панела</a
        >
      </div>
    </div>

    <!-- Weather Widget -->
    <div id="weatherWidget" style="display: none">
      <span id="weatherIcon"></span>
      <span id="weatherTemp"></span>
      <span id="weatherMsg"></span>
    </div>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Map Container -->
      <div id="map"></div>

      <!-- Cleanups Near You Section -->
      <div class="campaigns-section">
        <div class="container-fluid">
          <div class="campaigns-header d-flex align-items-center gap-3 flex-wrap">
            <h2 id="campaignsSectionTitle" class="mb-0" data-i18n="dashboard.nearYou">
              Почистване в близост до вас
            </h2>
            <button
              id="showAllBtn"
              class="btn btn-outline-secondary btn-sm"
              onclick="showAllCampaigns()"
              style="display: none"
              data-i18n="dashboard.showAll"
            >
              Виж всички квартали
            </button>
          </div>

          <!-- Loading Spinner -->
          <div id="loadingSpinner" class="spinner-container">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden" data-i18n="common.loading">Зареждане...</span>
            </div>
          </div>

          <!-- Campaigns Cards Container -->
          <div id="campaignsContainer" class="campaigns-grid"></div>

          <!-- No Campaigns Message -->
          <div id="noCampaignsMessage" class="no-campaigns-message" style="display: none">
            <p data-i18n="dashboard.noCampaigns">Няма активни кампании</p>
          </div>

          <!-- Load More -->
          <div id="loadMoreContainer" style="text-align: center; padding: 1.5rem 0; display: none">
            <button id="loadMoreBtn" class="btn btn-outline-success btn-lg">
              ⬇️ <span data-i18n="dashboard.loadMore">Зареди още</span>
            </button>
            <p id="campaignsCounter" class="text-muted mt-2" style="font-size: 0.9rem"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Leaflet JS -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard Script -->
    <script type="module" src="../scripts/dashboard.js"></script>
  </body>
</html>
