<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Clean Quarter</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- SweetAlert2 -->
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../assets/style.css" />

    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .reset-password-container {
        background: white;
        padding: 3rem 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }

      .reset-password-container h1 {
        color: #28a745;
        font-size: 1.8rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-align: center;
      }

      .reset-password-container p {
        color: #6c757d;
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .form-control {
        border-radius: 8px;
        padding: 0.75rem;
        border: 1px solid #e0e0e0;
      }

      .form-control:focus {
        border-color: #28a745;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
      }

      .btn-primary {
        background-color: #28a745;
        border: none;
        padding: 0.75rem;
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-primary:hover {
        background-color: #218838;
      }

      .password-requirements {
        background: #f8f9fa;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: #6c757d;
      }

      .password-requirements ul {
        margin: 0.5rem 0 0 0;
        padding-left: 1.5rem;
      }

      .password-requirements li {
        margin: 0.25rem 0;
      }

      .back-to-login {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-to-login a {
        color: #28a745;
        text-decoration: none;
        font-weight: 600;
      }

      .back-to-login a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="reset-password-container">
      <h1 data-i18n="auth.resetTitle">🔑 Create New Password</h1>
      <p data-i18n="auth.resetSubtitle">Enter your new password below.</p>

      <div class="password-requirements">
        <strong data-i18n="auth.passwordStrengthHint">Password Requirements:</strong>
        <ul>
          <li data-i18n="auth.pwMinLength">At least 8 characters</li>
          <li data-i18n="auth.pwUppercase">One uppercase letter (A-Z)</li>
          <li data-i18n="auth.pwLowercase">One lowercase letter (a-z)</li>
          <li data-i18n="auth.pwDigit">One number (0-9)</li>
        </ul>
      </div>

      <form id="resetPasswordForm">
        <div class="mb-3">
          <label for="newPassword" class="form-label" data-i18n="profile.newPassword">
            New Password
          </label>
          <input
            type="password"
            class="form-control"
            id="newPassword"
            data-i18n-placeholder="auth.newPasswordPlaceholder"
            placeholder="Enter new password"
            required
          />
          <div
            style="
              height: 6px;
              background-color: #e9ecef;
              border-radius: 3px;
              overflow: hidden;
              margin-top: 0.5rem;
            "
          >
            <div
              id="resetPasswordStrength"
              style="height: 100%; width: 0%; background-color: #dc3545; transition: all 0.3s ease"
            ></div>
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label" data-i18n="auth.confirmPassword">
            Confirm Password
          </label>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            data-i18n-placeholder="auth.confirmPasswordPlaceholder"
            placeholder="Confirm password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100" data-i18n="auth.resetPasswordButton">
          Reset Password
        </button>
      </form>

      <div class="back-to-login">
        <a href="/" data-i18n="auth.backToLogin">← Back to Login</a>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../scripts/reset-password.js"></script>
  </body>
</html>
