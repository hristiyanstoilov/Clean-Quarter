<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pages.forgotPasswordTitle">Forgot Password - Clean Quarter</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="../assets/style.css" />

    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .forgot-password-container {
        background: white;
        padding: 3rem 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
      }

      .forgot-password-container h1 {
        color: #28a745;
        font-size: 1.8rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-align: center;
      }

      .forgot-password-container p {
        color: #6c757d;
        text-align: center;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .form-control {
        border-radius: 8px;
        padding: 0.75rem;
        border: 1px solid #e0e0e0;
      }

      .form-control:focus {
        border-color: #28a745;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
      }

      .btn-primary {
        background-color: #28a745;
        border: none;
        padding: 0.75rem;
        font-weight: 600;
        border-radius: 8px;
      }

      .btn-primary:hover {
        background-color: #218838;
      }

      .back-to-login {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-to-login a {
        color: #28a745;
        text-decoration: none;
        font-weight: 600;
      }

      .back-to-login a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="forgot-password-container">
      <h1 data-i18n="auth.forgotTitle">🔐 Reset Password</h1>
      <p data-i18n="auth.forgotSubtitle">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <form id="forgotPasswordForm">
        <div class="mb-3">
          <label for="email" class="form-label" data-i18n="auth.emailLabel">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            data-i18n-placeholder="auth.emailPlaceholder"
            placeholder="your@email.com"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100" data-i18n="auth.sendResetLink">
          Send Reset Link
        </button>
      </form>

      <div class="back-to-login">
        <a href="../../index.html" data-i18n="auth.backToLogin">← Back to Login</a>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./modules/forgotPasswordModule.js"></script>
  </body>
</html>
