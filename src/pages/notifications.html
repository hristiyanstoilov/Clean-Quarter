<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Известия — Clean Quarter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>
    <div id="networkStatusBanner" role="alert" aria-live="polite" style="display: none"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">♻️ Чист Квартал</a>
        <button
          class="navbar-toggler"
          aria-label="Toggle navigation"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/dashboard" data-i18n="nav.dashboard">Начало</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/create-campaign" data-i18n="nav.createCampaign"
                >Нова кампания</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/events" data-i18n="nav.events">Събития</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile" data-i18n="nav.profile">Профил</a>
            </li>
            <li class="nav-item" id="adminNavItem" style="display: none">
              <a class="nav-link" href="/admin" data-i18n="nav.admin">Админ</a>
            </li>
            <li class="nav-item">
              <select
                id="languageSelector"
                class="form-select form-select-sm"
                style="max-width: 150px; margin: 0.5rem 0.5rem"
              >
                <option value="bg">🇧🇬 Български</option>
                <option value="en">🇬🇧 English</option>
              </select>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link" id="logoutBtn" data-i18n="nav.logout">Изход</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4" style="max-width: 720px">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0" data-i18n="notifications.historyTitle">История на известията</h1>
        <button
          id="markAllReadBtn"
          class="btn btn-sm btn-outline-secondary"
          data-i18n="notifications.markAllRead"
        >
          Маркирай всички
        </button>
      </div>

      <div id="notificationsList"></div>

      <div class="text-center mt-3">
        <button
          id="loadMoreBtn"
          class="btn btn-outline-success"
          style="display: none"
          data-i18n="notifications.loadMore"
        >
          Зареди още
        </button>
        <p
          id="allLoadedMsg"
          class="text-muted small"
          style="display: none"
          data-i18n="notifications.allLoaded"
        >
          Всички известия са заредени
        </p>
      </div>
    </div>

    <script type="module" src="../scripts/notifications-page.js"></script>
  </body>
</html>
