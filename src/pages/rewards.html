<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewards - Clean Quarter</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/style.css" />

    <!-- Rewards Page Styles -->
    <link rel="stylesheet" href="../assets/rewards.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">♻️ Clean Quarter</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="ms-auto" style="display: flex; gap: 1rem; align-items: center">
            <a href="/dashboard" data-i18n="nav.dashboard">Dashboard</a>
            <a href="/rewards" data-i18n="nav.rewards">Rewards</a>
            <a href="/profile" data-i18n="nav.profile">Profile</a>
            <select
              id="languageSelector"
              class="form-select form-select-sm"
              style="max-width: 150px; display: none"
            >
              <option value="bg">🇧🇬 Български</option>
              <option value="en">🇬🇧 English</option>
            </select>
            <a href="#" onclick="handleLogout()" data-i18n="nav.logout">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
      <!-- Loading State -->
      <div class="loading-spinner" id="loadingState">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Rewards Content (hidden until loaded) -->
      <div id="rewardsContent" style="display: none">
        <!-- Points Balance Card -->
        <div class="points-card">
          <div class="points-info">
            <h2>💰 Your Points Balance</h2>
            <div class="points-value">
              <span id="pointsBalance">0</span>
              <span style="font-size: 1.5rem">⭐</span>
            </div>
          </div>
          <div class="points-actions">
            <a href="/dashboard" class="btn-secondary-action">← Back to Dashboard</a>
            <a href="/profile" class="btn-secondary-action">📊 Transaction History</a>
          </div>
        </div>

        <!-- Rewards Header -->
        <div class="rewards-header">
          <h1>🎁 Rewards Shop</h1>
          <p>Exchange your points for amazing rewards!</p>
        </div>

        <!-- Error Message (hidden by default) -->
        <div class="error-message" id="errorMessage" style="display: none"></div>

        <!-- Rewards Grid -->
        <div class="rewards-grid" id="rewardsGrid">
          <!-- Rewards will be rendered here -->
        </div>
      </div>
    </div>

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main Script -->
    <script type="module" src="../scripts/rewards.js"></script>
  </body>
</html>
